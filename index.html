<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="0; url=/vi/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVAMAX - Manufacturing Operations & Transformation Partner</title>
    <meta name="description" content="INVAMAX provides factory transformation, factory operations, lean manufacturing, and digital platforms.">
    
    <!-- SEO & GEO Hreflang Tags -->
    <link rel="alternate" hreflang="vi" href="https://invamax.com/vi/index.html" />
    <link rel="alternate" hreflang="en" href="https://invamax.com/en/index.html" />
    <link rel="alternate" hreflang="x-default" href="https://invamax.com/en/index.html" />
    
    <script>
        // Check for manual language override first
        var storedLang = localStorage.getItem('invamax_lang');
        if (storedLang === 'vi') {
            window.location.replace('/vi/index.html');
        } else if (storedLang === 'en') {
            window.location.replace('/en/index.html');
        } else {
            // Check browser language
            var userLang = navigator.language || navigator.userLanguage;
            if (userLang.toLowerCase().startsWith('vi')) {
                window.location.replace('/vi/index.html');
            } else {
                // Default to English for non-Vietnamese traffic
                window.location.replace('/en/index.html');
            }
        }
    </script>
</head>
