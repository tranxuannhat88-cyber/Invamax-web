    <style id="a4-report-styles">



/* A4 Report Styles */



.a4-wrapper {



    width: 100%;



    overflow-x: auto;



    display: flex;



    flex-direction: column;



    align-items: center;



    background: #f1f5f9;



    padding: 20px 0;



}







.a4-page {



    width: 100%;



    max-width: 210mm;



    min-height: 297mm;



    margin: 0 auto 30px;



    background: #ffffff;



    color: #1f2937;



    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);



    box-sizing: border-box;



    display: flex;



    flex-direction: column;



    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;



    border: 1px solid #e2e8f0;



    page-break-after: always;



    page-break-inside: avoid;



}















.a4-title-center {



    text-align: center;



    font-weight: bold;



    font-size: 16px;



    color: #0f172a;



    letter-spacing: 1px;



}







.a4-header-right {



    font-size: 11px;



    font-weight: bold;



    color: #f97316;



    text-align: right;



}







.a4-content {



    flex-grow: 1;



    padding: 20px;



}















.a4-grid-2 {



    display: grid;



    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));



    gap: 20px;



}







.a4-box {



    background: #f8fafc;



    border-radius: 24px;



    padding: 12px;



    border: 1px solid #e2e8f0;



}







.a4-box h3 {



    margin: 0 0 15px 0;



    font-size: 13px;



    text-transform: uppercase;



    color: #475569;



    border-bottom: 1px solid #e2e8f0;



    padding-bottom: 8px;



}







.a4-table-info {



    width: 100%;



    border-collapse: collapse;



    font-size: 13px;



}







.a4-table-info td {



    padding: 8px 0;



    border-bottom: 1px solid #e2e8f0;



}







.a4-table-info tr td:first-child {



    color: #64748b;



    width: 40%;



}







.a4-flex-3 {



    display: flex;



    gap: 15px;



}







.a4-issue-card {



    flex: 1;



    background: #ffffff;



    border-radius: 24px;



    padding: 10px;



    text-align: center;



    border: 1px solid #e2e8f0;



}







.a4-issue-card .circle-num {



    width: 30px;



    height: 30px;



    background: #f97316;



    color: white;



    border-radius: 50%;



    display: flex;



    align-items: center;



    justify-content: center;



    font-weight: bold;



    margin: 0 auto 10px;



}







.a4-flex-8 {



    display: flex;



    flex-wrap: wrap;



    gap: 10px;



    justify-content: center;



}







.a4-waste-pill {



    background: #ffffff;



    border: 1px solid #e2e8f0;



    padding: 5px 10px;



    border-radius: 20px;



    font-size: 11px;



    display: flex;



    flex-direction: column;



    align-items: center;



    width: calc(25% - 10px);



}







.a4-waste-pill span {



    font-weight: bold;



    color: #f97316;



    font-size: 13px;



}







.a4-heatmap-grid {



    display: grid;



    grid-template-columns: repeat(4, 1fr);



    gap: 10px;



}
